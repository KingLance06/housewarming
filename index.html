<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Directions — Ganapathy Housewarming</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --indigo:#1B2A44;
    --brass:#C9A15A;
    --brass-light:#E4C88A;
    --terracotta:#B5533C;
    --ivory:#F4ECDC;
    --ivory-dim:#E9DEC6;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background: linear-gradient(180deg, #2A1B32 0%, #5A2A3D 28%, #9C4A3C 55%, #D68A42 82%, #E8A94F 100%);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 16px;
    font-family:'Work Sans', sans-serif;
    position:relative;
    overflow-x:hidden;
  }
  .card{
    width:100%;
    max-width:440px;
    background: linear-gradient(180deg, var(--ivory) 0%, var(--ivory-dim) 100%);
    border-radius:28px;
    padding:44px 32px 38px;
    box-shadow: 0 30px 70px rgba(0,0,0,0.55);
    border:1px solid rgba(201,161,90,0.4);
    text-align:center;
  }
  .pin{
    width:52px;height:52px;
    margin:0 auto 18px;
    display:flex;align-items:center;justify-content:center;
    border-radius:50%;
    background:var(--indigo);
  }
  .pin svg{width:26px;height:26px;}
  .eyebrow{
    font-size:12.5px;
    letter-spacing:0.12em;
    color:var(--terracotta);
    font-weight:600;
    text-transform:uppercase;
    margin-bottom:8px;
  }
  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    font-size:32px;
    color:var(--indigo);
    margin-bottom:20px;
    line-height:1.2;
  }
  .venue-name{
    font-family:'Cormorant Garamond', serif;
    font-size:19px;
    font-weight:600;
    color:var(--indigo);
    margin-bottom:6px;
  }
  .venue-addr{
    font-size:13.5px;
    color:var(--indigo);
    opacity:0.75;
    line-height:1.6;
    margin-bottom:28px;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:100%;
    padding:15px 20px;
    background: var(--terracotta);
    color:#fff;
    text-decoration:none;
    border-radius:12px;
    font-weight:600;
    font-size:15px;
    letter-spacing:0.02em;
    box-shadow: 0 8px 20px rgba(181,83,60,0.35);
    transition: transform 0.15s ease;
    margin-bottom:12px;
  }
  .btn:active{ transform: scale(0.98); }
  .btn svg{ width:18px;height:18px; }
  .btn-secondary{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:100%;
    padding:13px 20px;
    background: transparent;
    color:var(--indigo);
    border:1.4px solid var(--brass);
    text-decoration:none;
    border-radius:12px;
    font-weight:500;
    font-size:14px;
    cursor:pointer;
    font-family:inherit;
  }
  .divider{
    display:flex;align-items:center;gap:10px;
    margin: 22px 0 16px;
  }
  .divider .line{ height:1px; flex:1; background:var(--brass); opacity:0.5; }
  .divider span{ font-size:11px; letter-spacing:0.1em; color:var(--indigo); opacity:0.6; }
  .footer{
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--indigo);
    opacity:0.55;
    margin-top:6px;
  }
  .toast{
    margin-top:10px;
    font-size:12px;
    color:var(--terracotta);
    opacity:0;
    transition:opacity 0.25s ease;
    min-height:16px;
  }
  .toast.show{ opacity:1; }

  .bg-particles{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
  }
  .card{ position:relative; z-index:1; }

  .particle{
    position:absolute;
    bottom:-40px;
    left:var(--x);
    opacity:0;
    animation: floatUp var(--dur) linear var(--delay) infinite;
  }
  .particle.petal{
    width:var(--size);
    height:calc(var(--size) * 0.7);
    background: linear-gradient(135deg, #E9A24B, #C9663B);
    border-radius: 60% 40% 60% 40%;
    box-shadow: 0 0 6px rgba(233,162,75,0.4);
  }
  .particle.spark{
    width:var(--size);
    height:var(--size);
    border-radius:50%;
    background: radial-gradient(circle, #F4D999 0%, rgba(244,217,153,0) 70%);
  }

  @keyframes floatUp{
    0%{
      transform: translate(0, 0) rotate(0deg);
      opacity:0;
    }
    8%{ opacity:0.85; }
    50%{
      transform: translate(var(--drift), -55vh) rotate(180deg);
    }
    92%{ opacity:0.7; }
    100%{
      transform: translate(calc(var(--drift) * 1.6), -115vh) rotate(360deg);
      opacity:0;
    }
  }

  @media (prefers-reduced-motion: reduce){
    .particle{ animation: none; display:none; }
  }

  .sky-glow{
    position:fixed;
    top:6%;
    left:50%;
    transform:translateX(-50%);
    width:220px;height:220px;
    border-radius:50%;
    background: radial-gradient(circle, rgba(255,224,170,0.55) 0%, rgba(255,224,170,0) 70%);
    z-index:0;
    pointer-events:none;
  }

  .skyline{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    z-index:0;
    pointer-events:none;
    opacity:0.92;
  }
</style>
</head>
<body>
  <div class="sky-glow"></div>
  <div class="bg-particles" id="bgParticles"></div>

  <svg class="skyline" viewBox="0 0 400 130" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">

    <rect x="55" y="80" width="50" height="50" fill="#331F30"/>

    <rect x="86" y="98" width="10" height="12" fill="#F4D999" opacity="0.4"/>

    <rect x="100" y="55" width="55" height="75" fill="#2A1B32"/>
    <polygon points="100,55 127.5,28 155,55" fill="#2A1B32"/>
    <rect x="112" y="75" width="11" height="13" fill="#F4D999" opacity="0.85"/>
    <rect x="133" y="75" width="11" height="13" fill="#F4D999" opacity="0.5"/>
    <rect x="112" y="98" width="11" height="13" fill="#F4D999" opacity="0.5"/>
    <rect x="133" y="98" width="11" height="13" fill="#F4D999" opacity="0.8"/>

    <rect x="150" y="85" width="48" height="45" fill="#331F30"/>
    <polygon points="150,85 174,64 198,85" fill="#331F30"/>
    <rect x="160" y="102" width="10" height="12" fill="#F4D999" opacity="0.6"/>
    <rect x="180" y="102" width="10" height="12" fill="#F4D999" opacity="0.85"/>

    <rect x="193" y="50" width="60" height="80" fill="#2A1B32"/>
    <polygon points="193,50 223,22 253,50" fill="#2A1B32"/>
    <rect x="205" y="70" width="12" height="14" fill="#F4D999" opacity="0.75"/>
    <rect x="228" y="70" width="12" height="14" fill="#F4D999" opacity="0.5"/>
    <rect x="205" y="95" width="12" height="14" fill="#F4D999" opacity="0.5"/>

    <rect x="248" y="82" width="50" height="48" fill="#331F30"/>
    <polygon points="248,82 273,60 298,82" fill="#331F30"/>

    <rect x="293" y="58" width="55" height="72" fill="#2A1B32"/>

    <rect x="304" y="78" width="11" height="13" fill="#F4D999" opacity="0.8"/>
    <rect x="325" y="78" width="11" height="13" fill="#F4D999" opacity="0.45"/>
    <rect x="304" y="100" width="11" height="13" fill="#F4D999" opacity="0.45"/>
    <rect x="325" y="100" width="11" height="13" fill="#F4D999" opacity="0.8"/>

    <rect x="343" y="86" width="57" height="44" fill="#331F30"/>
    <polygon points="343,86 371.5,63 400,86" fill="#331F30"/>
    <rect x="354" y="103" width="10" height="12" fill="#F4D999" opacity="0.7"/>
    <rect x="378" y="103" width="10" height="12" fill="#F4D999" opacity="0.5"/>
  </svg>

  <!--
    BACKGROUND MUSIC:
    Upload your own mp3 to this same GitHub repo (e.g. music.mp3) and it will
    play automatically, looping, just like sagiless02.github.io/Navigation/ does.
    Autoplay-with-sound is blocked by phones until the visitor taps the screen
    once, so it starts silently on the very first tap/scroll — no icon needed.
  -->
  <audio id="bgMusic" src="music.mp3" loop preload="auto"></audio>

  <div class="card" id="card">
    <div class="pin">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 21C12 21 19 14.6 19 9.5C19 5.36 15.64 2 12 2C8.36 2 5 5.36 5 9.5C5 14.6 12 21 12 21Z" stroke="#E4C88A" stroke-width="1.5"/><circle cx="12" cy="9.5" r="2.6" stroke="#E4C88A" stroke-width="1.5"/></svg>
    </div>
    <div class="eyebrow">Find your way to</div>
    <h1>Our New Home</h1>

    <div class="venue-name">No. 20, Jalan Sungai Merbau 32/76C</div>
    <div class="venue-addr">Seksyen 32, Bukit Kemuning<br>40460, Selangor, Malaysia</div>

    <a class="btn" id="directionsBtn" href="https://www.google.com/maps/search/?api=1&query=No.20%2C%20Jalan%20Sungai%20Merbau%2032%2F76C%2C%20Seksyen%2032%2C%20Bukit%20Kemuning%2C%2040460%20Selangor%2C%20Malaysia" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none"><path d="M3 11L21 3L13 21L11 13L3 11Z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
      Get Directions
    </a>
    <button class="btn-secondary" onclick="copyAddress()">Copy Address</button>
    <div class="toast" id="toast">Address copied</div>

    <div class="divider"><span class="line"></span><span>housewarming celebration</span><span class="line"></span></div>
    <div class="footer">Ganapathy &amp; Family</div>
  </div>

  <script>
    // Gently rising marigold petals + warm light sparks in the background
    (function(){
      const container = document.getElementById('bgParticles');
      const total = 22;
      for (let i = 0; i < total; i++){
        const el = document.createElement('div');
        const isPetal = Math.random() > 0.4;
        el.className = 'particle ' + (isPetal ? 'petal' : 'spark');
        const size = isPetal ? (10 + Math.random() * 10) : (3 + Math.random() * 5);
        el.style.setProperty('--size', size + 'px');
        el.style.setProperty('--x', Math.random() * 100 + 'vw');
        el.style.setProperty('--drift', (Math.random() * 120 - 60) + 'px');
        el.style.setProperty('--dur', (10 + Math.random() * 10) + 's');
        el.style.setProperty('--delay', (Math.random() * -20) + 's');
        container.appendChild(el);
      }
    })();

    // Start the background music on the visitor's first tap/scroll —
    // phones block audio with sound from autoplaying until there's a gesture.
    // IMPORTANT: keep retrying on every tap until play() actually succeeds —
    // a single failed attempt should not give up permanently.
    (function(){
      const music = document.getElementById('bgMusic');
      let playing = false;

      function attemptPlay(){
        if (playing) return;
        music.muted = false;
        music.volume = 1;
        const p = music.play();
        if (p && typeof p.then === 'function'){
          p.then(() => {
            playing = true;
          }).catch(() => {
            // failed silently — leave listeners active so the next tap retries
          });
        } else {
          playing = true;
        }
      }

      ['click', 'touchend', 'touchstart', 'scroll', 'pointerdown'].forEach(evt => {
        document.addEventListener(evt, attemptPlay, { passive: true });
      });

      // Try immediately too, in case the browser allows it outright
      window.addEventListener('DOMContentLoaded', attemptPlay);

      // Once actually playing, stop re-attempting
      music.addEventListener('playing', () => { playing = true; });
    })();

    function copyAddress(){
      const addr = "No. 20, Jalan Sungai Merbau 32/76C, Seksyen 32, Bukit Kemuning, 40460 Selangor, Malaysia";
      navigator.clipboard.writeText(addr).then(() => {
        const t = document.getElementById('toast');
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 1800);
      });
    }
  </script>
</body>
</html>
